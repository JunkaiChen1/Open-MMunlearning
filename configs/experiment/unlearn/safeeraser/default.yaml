# @package _global_

defaults:
  - override /model: Qwen2.5-VL-3B-Instruct
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: SAFEERASER_QA_forget
  - override /data/datasets@data.retain: SAFEERASER_QA_retain
  - override /collator: DataCollatorForMultimodalQADataset
  - override /peft: lora
  - override /eval: null

mode: unlearn

safeeraser_data_dir: ${paths.data_dir}/unlearn/safeeraser
forget_split: forget
retain_split: retain

data:
  anchor: forget
  forget:
    SAFEERASER_QA_forget:
      args:
        hf_args:
          data_files: ${safeeraser_data_dir}/${forget_split}/train-00000-of-00001.parquet
  retain:
    SAFEERASER_QA_retain:
      args:
        hf_args:
          data_files: ${safeeraser_data_dir}/${retain_split}/train-00000-of-00001.parquet

collator:
  DataCollatorForMultimodalQADataset:
    args:
      processor_path: ${model.tokenizer_args.pretrained_model_name_or_path}
      max_length: ${oc.select:model.tokenizer_args.model_max_length,2048}
      system_prompt: ${model.template_args.system_prompt}
      image_max_pixels: 200704
      padding_side: ${oc.select:model.tokenizer_args.padding_side,null}

trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 5
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    gradient_checkpointing: true
    ddp_find_unused_parameters: true
    remove_unused_columns: false
    do_eval: false
    eval_strategy: "no"
    eval_on_start: false
    save_strategy: epoch
    save_only_model: true
    report_to: none

peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  module_preset: attn

eval: null
task_name: safeeraser_unlearn_default
