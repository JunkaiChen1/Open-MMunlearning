# @package _global_

defaults:
  - /experiment/unlearn/mllmu/default
  - override /trainer: SMFA
  - _self_

forget_idk_path: ${paths.root_dir}/configs/data/idk_responses.txt

model:
  model_args:
    torch_dtype: bfloat16

collator:
  DataCollatorForMultimodalQADataset:
    args:
      include_text_only: true

trainer:
  args:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 1
    learning_rate: 1e-4
    num_train_epochs: 5
    bf16: true
    fp16: false
    save_strategy: "no"
