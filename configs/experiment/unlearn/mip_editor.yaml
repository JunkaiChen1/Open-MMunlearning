# @package _global_

defaults:
  - override /trainer: MIPEditor
  - override /peft: none
  - _self_

model:
  merge_adapter: true

data:
  anchor: retain

collator:
  DataCollatorForMultimodalQADataset:
    args:
      include_text_only: true

# Dataset experiments override trainer defaults, so put the official adaptive
# RMU optimization settings here as well as in the standalone trainer config.
trainer:
  args:
    seed: 42
    learning_rate: 5e-4
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1e-8
    optim: adamw_torch
    lr_scheduler_type: linear
    warmup_epochs: 0
    warmup_steps: 0
    max_grad_norm: 0.0
    num_train_epochs: 1
    per_device_train_batch_size: 6
    gradient_accumulation_steps: 1
    gradient_checkpointing: false
    ddp_find_unused_parameters: false
    save_strategy: "no"
