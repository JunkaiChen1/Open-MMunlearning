# @package _global_

defaults:
  - /experiment/unlearn/mllmubench/default
  - override /model: LLaVA_Vanilla_7b
  - override /trainer: MMUnlearner
  - override /peft: lora

collator:
  DataCollatorForMultimodalQADataset:
    args:
      include_text_only: true

peft:
  custom_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - out_proj
    - gate_proj
    - up_proj
    - down_proj
    - fc1
    - fc2
    - linear_1
    - linear_2

trainer:
  method_args:
    mask_save_path: ${trainer.args.output_dir}/mmunlearner_mask.pt

task_name: mmunlearner_llava7b
