# @package _global_

defaults:
  - override /model: llava-1.5-7b-hf
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: COVUBENCH_QA_forget
  - override /data/datasets@data.retain: COVUBENCH_QA_retain
  - override /collator: DataCollatorForMultimodalQADataset
  - override /peft: lora
  - override /eval: null

mode: unlearn

covubench_data_dir: ${paths.data_dir}/unlearn/covubench
stage1_task_name: covubench_llava_ft
forget_split: forget_5
retain_split: retain_95

model:
  adapter_path: ${paths.root_dir}/saves/finetune/${stage1_task_name}

data:
  anchor: forget
  forget:
    COVUBENCH_QA_forget:
      args:
        hf_args:
          data_files: ${covubench_data_dir}/${forget_split}/train-*.parquet
  retain:
    COVUBENCH_QA_retain:
      args:
        hf_args:
          data_files: ${covubench_data_dir}/${retain_split}/train-*.parquet

collator:
  DataCollatorForMultimodalQADataset:
    args:
      processor_path: ${model.tokenizer_args.pretrained_model_name_or_path}
      max_length: ${oc.select:model.tokenizer_args.model_max_length,2048}
      system_prompt: ${model.template_args.system_prompt}
      image_max_pixels: 200704
      padding_side: ${oc.select:model.tokenizer_args.padding_side,null}

trainer:
  args:
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 7
    optim: adamw_torch
    dataloader_num_workers: 4
    dataloader_prefetch_factor: 2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    gradient_checkpointing: true
    ddp_find_unused_parameters: true
    remove_unused_columns: false
    do_eval: false
    eval_strategy: "no"
    eval_on_start: false
    save_strategy: "no"
    report_to: none

eval: null
task_name: covubench_unlearn_default

peft:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  module_preset: all
