# @package _global_

defaults:
  - /experiment/eval/mllm_eval/naming
  - override /model: llava-1.5-7b-hf
  - override /eval: sua
  - _self_

ratio: 10
eval:
  sua:
    ratio: ${ratio}
    split: forget
    max_records: 48
    sua:
      iterations: 500
      batch_size: 6

eval_name: ${hydra:runtime.choices.eval}_mllmu_ratio${ratio}
