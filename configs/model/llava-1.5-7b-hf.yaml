model_handler: LlavaForConditionalGeneration
model_args:
  pretrained_model_name_or_path: "${oc.env:MMU_MODEL_ROOT,llava-hf}/llava-1.5-7b-hf"
  torch_dtype: float16
tokenizer_args:
  pretrained_model_name_or_path: ${model.model_args.pretrained_model_name_or_path}
template_args:
  apply_chat_template: true
  system_prompt: ""
  user_start_tag: "USER: "
  user_end_tag: " "
  asst_start_tag: "ASSISTANT: "
  asst_end_tag: " "
