# Official data sources, pinned revisions, and local layouts for setup_data.py.
data_root: null
mllmu_benchmark_source: ${oc.env:MLLMU_BENCHMARK_SOURCE,${data_root}/source/mllmu}
mllmu_baseline_source: ${oc.env:MLLMU_BASELINE_SOURCE,${data_root}/source/mllmu/baseline_train_split}

datasets:
  mllmu:
    sources:
      - kind: huggingface
        repo_id: MLLMMU/MLLMU-Bench
        revision: e91a01eb060b61be8dbde7edb48b121341bd0890
        allow_patterns:
          - Full_Set/*.parquet
          - Retain_Set/*.parquet
          - Test_Set/*.parquet
          - ft_Data/*.parquet
          - forget_*/*.parquet
          - retain_*/*.parquet
        local_dir: ${mllmu_benchmark_source}
      - kind: huggingface
        repo_id: MLLMMU/baseline_train_split
        repo_type: model
        revision: f4d16e57a72ca1d4b3fa2e0fa01c84f113f8a2e6
        allow_patterns:
          - forget_*/*.parquet
          - forget_*/*.json
          - retain_*/*.parquet
          - retain_*/*.json
        local_dir: ${mllmu_baseline_source}
    links:
      - source_pattern: ${mllmu_benchmark_source}
        destination: ${data_root}/eval/mllmu
    required_sources:
      - ${mllmu_benchmark_source}/ft_Data/*.parquet
      - ${mllmu_benchmark_source}/Full_Set/*.parquet
      - ${mllmu_benchmark_source}/Test_Set/*.parquet
      - ${mllmu_benchmark_source}/Retain_Set/*.parquet
      - ${mllmu_benchmark_source}/forget_5/*.parquet
      - ${mllmu_benchmark_source}/forget_10/*.parquet
      - ${mllmu_benchmark_source}/forget_15/*.parquet
      - ${mllmu_benchmark_source}/retain_85/*.parquet
      - ${mllmu_benchmark_source}/retain_90/*.parquet
      - ${mllmu_benchmark_source}/retain_95/*.parquet
      - ${mllmu_baseline_source}/forget_5/*.parquet
      - ${mllmu_baseline_source}/forget_10/*.parquet
      - ${mllmu_baseline_source}/forget_15/*.parquet
      - ${mllmu_baseline_source}/retain_85/*.parquet
      - ${mllmu_baseline_source}/retain_90/*.parquet
      - ${mllmu_baseline_source}/retain_95/*.parquet
    prepare:
      - scripts/prepare_mllmu.py
      - --benchmark-source
      - ${mllmu_benchmark_source}
      - --baseline-source
      - ${mllmu_baseline_source}
      - --output-root
      - ${data_root}
      - --splits
      - forget_5
      - forget_10
      - forget_15
      - retain_85
      - retain_90
      - retain_95
    required_outputs:
      - ${data_root}/finetune/mllmu/train-*.parquet
      - ${data_root}/unlearn/mllmu/forget_5/train-*.parquet
      - ${data_root}/unlearn/mllmu/forget_10/train-*.parquet
      - ${data_root}/unlearn/mllmu/forget_15/train-*.parquet
      - ${data_root}/unlearn/mllmu/retain_85/train-*.parquet
      - ${data_root}/unlearn/mllmu/retain_90/train-*.parquet
      - ${data_root}/unlearn/mllmu/retain_95/train-*.parquet
    optional_files:
      - path: ${data_root}/eval/mllmu/truth_ratio/full_set_generation_variants.jsonl
        description: "Truth Ratio sidecar is not in the official dataset. Supply --mllmu-truth-ratio PATH, or evaluate with eval.mllmu.generation_truth_ratio=false."

  fiubench:
    sources:
      - kind: huggingface
        repo_id: gray311/FIUBench
        revision: d9314f80f7214fbb41da238dbd45d61564b35e31
        allow_patterns: [full.json, split.json, SFHQ.zip]
        local_dir: ${data_root}/source/fiubench
    archives:
      - path: ${data_root}/source/fiubench/SFHQ.zip
        destination: ${data_root}/source/fiubench
    required_sources:
      - ${data_root}/source/fiubench/full.json
      - ${data_root}/source/fiubench/split.json
      - ${data_root}/source/fiubench/SFHQ/*.jpg
    prepare: [scripts/prepare_fiubench.py, --source-root, "${data_root}/source/fiubench", --output-root, "${data_root}"]
    required_outputs:
      - ${data_root}/finetune/fiubench/train-*.parquet
      - ${data_root}/unlearn/fiubench/forget_1/train-*.parquet
      - ${data_root}/unlearn/fiubench/forget_5/train-*.parquet
      - ${data_root}/unlearn/fiubench/forget_10/train-*.parquet
      - ${data_root}/unlearn/fiubench/retain_99/train-*.parquet
      - ${data_root}/unlearn/fiubench/retain_95/train-*.parquet
      - ${data_root}/unlearn/fiubench/retain_90/train-*.parquet
      - ${data_root}/unlearn/fiubench/retain/train-*.parquet

  clear:
    sources:
      - kind: huggingface
        repo_id: therem/CLEAR
        revision: cc1e5b3687e6768ce3e055ea37a2f09fda627ba9
        allow_patterns: ["*.parquet"]
        ignore_patterns: ["data/*"]
        local_dir: ${data_root}/source/clear
    links:
      - source_pattern: ${data_root}/source/clear
        destination: ${data_root}/eval/clear
    required_sources:
      - ${data_root}/source/clear/full/*.parquet
      - ${data_root}/source/clear/full+tofu/*.parquet
      - ${data_root}/source/clear/real_faces/*.parquet
      - ${data_root}/source/clear/real_world/*.parquet
    prepare: [scripts/prepare_clear.py, --source-root, "${data_root}/source/clear", --output-root, "${data_root}"]
    required_outputs:
      - ${data_root}/finetune/clear/train-*.parquet
      - ${data_root}/unlearn/clear/forget_1/train-*.parquet
      - ${data_root}/unlearn/clear/forget_5/train-*.parquet
      - ${data_root}/unlearn/clear/forget_10/train-*.parquet
      - ${data_root}/unlearn/clear/retain_90/train-*.parquet
      - ${data_root}/unlearn/clear/retain_95/train-*.parquet
      - ${data_root}/unlearn/clear/retain_99/train-*.parquet

  covubench:
    sources:
      - kind: huggingface
        repo_id: herbwood27/CoVUBench
        revision: 64f8c0a2e562833e9808818e8fcb08befb28ae94
        allow_patterns: ["data/*.parquet"]
        local_dir: ${data_root}/source/covubench
    links:
      - source_pattern: ${data_root}/source/covubench/data
        destination: ${data_root}/eval/covubench
    required_sources:
      - ${data_root}/source/covubench/data/finetune-*.parquet
      - ${data_root}/source/covubench/data/test-*.parquet
      - ${data_root}/source/covubench/data/retain-*.parquet
    prepare: [scripts/prepare_covubench.py, --source-root, "${data_root}/source/covubench", --output-root, "${data_root}"]
    required_outputs:
      - ${data_root}/finetune/covubench/train-*.parquet
      - ${data_root}/unlearn/covubench/forget_5/train-*.parquet
      - ${data_root}/unlearn/covubench/forget_10/train-*.parquet
      - ${data_root}/unlearn/covubench/forget_15/train-*.parquet
      - ${data_root}/unlearn/covubench/forget_20/train-*.parquet
      - ${data_root}/unlearn/covubench/retain_95/train-*.parquet
      - ${data_root}/unlearn/covubench/retain_90/train-*.parquet
      - ${data_root}/unlearn/covubench/retain_85/train-*.parquet
      - ${data_root}/unlearn/covubench/retain_80/train-*.parquet

  safeeraser:
    sources:
      # https://github.com/yuu250/SafeEraser links this public Google Drive file.
      - kind: gdrive
        file_id: 1DxcqHMT-LuCAoaJkF1UfCphPbbuUHlQq
        output: ${data_root}/source/safeeraser/safeeraser_dataset.zip
    archives:
      - path: ${data_root}/source/safeeraser/safeeraser_dataset.zip
        destination: ${data_root}/source/safeeraser/unpacked
    links:
      - source_pattern: ${data_root}/source/safeeraser/unpacked/**/all_train.json
        destination: ${data_root}/source/safeeraser/input
        parent: true
      - source_pattern: ${data_root}/source/safeeraser/unpacked/**/all_train.json
        destination: ${data_root}/eval/safeeraser
        parent: true
    required_sources:
      - ${data_root}/source/safeeraser/input/all_train.json
      - ${data_root}/eval/safeeraser/all_train.json
      - ${data_root}/eval/safeeraser/all_val.json
    prepare: [scripts/prepare_safeeraser.py, --source-root, "${data_root}/source/safeeraser/input", --output-root, "${data_root}/unlearn/safeeraser"]
    required_outputs:
      - ${data_root}/unlearn/safeeraser/forget/train-*.parquet
      - ${data_root}/unlearn/safeeraser/retain/train-*.parquet

  spavl:
    sources:
      - kind: huggingface
        repo_id: sqrti/SPA-VL
        revision: 0e75b34a9e803a236873420c8680de3889befd62
        allow_patterns: ["data/train-*.parquet"]
        local_dir: ${data_root}/source/spavl
    required_sources: ["${data_root}/source/spavl/data/train-*.parquet"]
    prepare: [scripts/prepare_spavl.py, --source-root, "${data_root}/source/spavl", --output-root, "${data_root}/unlearn/spavl_rejected", --mode, full]
    required_outputs: ["${data_root}/unlearn/spavl_rejected/train/train-*.parquet"]

  pope:
    group: evaluation
    sources:
      # Compact lmms-eval mirror of the official COCO POPE random split.
      - kind: huggingface
        repo_id: lmms-lab/POPE
        revision: 4db1276663dfa5eb8ad16a52d24c31a09e470896
        allow_patterns: ["Full/random-*.parquet"]
        local_dir: ${data_root}/source/pope
    required_sources: ["${data_root}/source/pope/Full/random-*.parquet"]
    prepare: [scripts/prepare_multimodal_eval.py, --benchmark, pope, --source-root, "${data_root}/source/pope", --output-root, "${data_root}/eval/pope"]
    required_outputs:
      - ${data_root}/eval/pope/coco_pope_random.json
      - ${data_root}/eval/pope/images/*.jpg

  mmvet:
    group: evaluation
    sources:
      - kind: http
        url: https://github.com/yuweihao/MM-Vet/releases/download/v1/mm-vet.zip
        size: 66540341
        output: ${data_root}/source/mmvet/mm-vet.zip
    archives:
      - path: ${data_root}/source/mmvet/mm-vet.zip
        destination: ${data_root}/source/mmvet/unpacked
    links:
      - source_pattern: ${data_root}/source/mmvet/unpacked/**/mm-vet.json
        destination: ${data_root}/eval/mmvet
        parent: true
    required_sources:
      - ${data_root}/eval/mmvet/mm-vet.json
      - ${data_root}/eval/mmvet/images/*

  mmbench:
    group: evaluation
    sources:
      - kind: http
        url: https://download.openmmlab.com/mmclassification/datasets/mmbench/mmbench_dev_en_20231003.tsv
        size: 136350939
        output: ${data_root}/source/mmbench/mmbench_dev_en.tsv
    links:
      - source_pattern: ${data_root}/source/mmbench/mmbench_dev_en.tsv
        destination: ${data_root}/eval/mmbench/mmbench_dev_en.tsv
    required_sources: ["${data_root}/eval/mmbench/mmbench_dev_en.tsv"]

  vizwiz:
    group: evaluation
    sources:
      # Validation split with all human answers and embedded images.
      - kind: huggingface
        repo_id: lmms-lab-encoder/VizWiz-VQA
        revision: d428a2dae984f79cf1b9d99467dfa883e0c30686
        allow_patterns: ["data/val-*.parquet"]
        local_dir: ${data_root}/source/vizwiz
    required_sources: ["${data_root}/source/vizwiz/data/val-*.parquet"]
    prepare: [scripts/prepare_multimodal_eval.py, --benchmark, vizwiz, --source-root, "${data_root}/source/vizwiz", --output-root, "${data_root}/eval/vizwiz"]
    required_outputs:
      - ${data_root}/eval/vizwiz/VizWiz.tsv
      - ${data_root}/eval/vizwiz/images/*.jpg

  scienceqa:
    group: evaluation
    sources:
      - kind: http
        url: https://raw.githubusercontent.com/lupantech/ScienceQA/2cbf8318e07b9ece895bb2ae605e71e38d623264/data/scienceqa/problems.json
        size: 31529211
        output: ${data_root}/source/scienceqa/problems.json
      - kind: http
        url: https://scienceqa.s3.us-west-1.amazonaws.com/images/val.zip
        size: 209680739
        output: ${data_root}/source/scienceqa/val.zip
    archives:
      - path: ${data_root}/source/scienceqa/val.zip
        destination: ${data_root}/source/scienceqa/images
    links:
      - source_pattern: ${data_root}/source/scienceqa
        destination: ${data_root}/eval/scienceqa
    required_sources:
      - ${data_root}/eval/scienceqa/problems.json
      - ${data_root}/eval/scienceqa/images/val/*/image.png

  gqa:
    group: evaluation
    sources:
      - kind: huggingface
        repo_id: lmms-lab/GQA
        revision: a6e72d6e1b912da88af8b2f9eba05d5ea8ec2dd8
        allow_patterns: ["testdev_balanced_instructions/*.parquet", "testdev_balanced_images/*.parquet"]
        local_dir: ${data_root}/source/gqa
    links:
      - source_pattern: ${data_root}/source/gqa/testdev_balanced_instructions/*.parquet
        destination: ${data_root}/eval/gqa/testdev_balanced_instructions.parquet
      - source_pattern: ${data_root}/source/gqa/testdev_balanced_images/*.parquet
        destination: ${data_root}/eval/gqa/testdev_balanced_images.parquet
    required_sources:
      - ${data_root}/eval/gqa/testdev_balanced_instructions.parquet
      - ${data_root}/eval/gqa/testdev_balanced_images.parquet

  vqav2:
    group: evaluation
    sources:
      # Official VQA v2 validation annotations and COCO 2014 validation images.
      - kind: http
        url: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Questions_Val_mscoco.zip
        size: 3494929
        output: ${data_root}/source/vqav2/v2_Questions_Val_mscoco.zip
      - kind: http
        url: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Annotations_Val_mscoco.zip
        size: 10518930
        output: ${data_root}/source/vqav2/v2_Annotations_Val_mscoco.zip
      - kind: http
        url: https://s3.amazonaws.com/images.cocodataset.org/zips/val2014.zip
        size: 6645013297
        output: ${data_root}/source/vqav2/val2014.zip
    archives:
      - path: ${data_root}/source/vqav2/v2_Questions_Val_mscoco.zip
        destination: ${data_root}/source/vqav2/questions
      - path: ${data_root}/source/vqav2/v2_Annotations_Val_mscoco.zip
        destination: ${data_root}/source/vqav2/annotations
      - path: ${data_root}/source/vqav2/val2014.zip
        destination: ${data_root}/source/vqav2/images
    links:
      - source_pattern: ${data_root}/source/vqav2
        destination: ${data_root}/eval/vqav2
    required_sources:
      - ${data_root}/eval/vqav2/questions/v2_OpenEnded_mscoco_val2014_questions.json
      - ${data_root}/eval/vqav2/annotations/v2_mscoco_val2014_annotations.json
      - ${data_root}/eval/vqav2/images/val2014/*.jpg

  idk:
    sources:
      - kind: huggingface
        repo_id: open-unlearning/idk
        revision: main
        allow_patterns: ["*.jsonl"]
        local_dir: ${data_root}
    required_sources: ["${data_root}/*.jsonl"]
