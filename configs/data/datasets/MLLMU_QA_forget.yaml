MLLMU_QA_forget:
  handler: ImageQADataset
  args:
    hf_args:
      path: "parquet"
      data_files: "${paths.data_dir}/unlearn/mllmu/forget_10/train-00000-of-00001.parquet"
      split: "train"
    image_key: "image"
    id_key: "ID"
    question_key: "question"
    answer_key: "answer"
    max_length: 512
    tokenize: false
