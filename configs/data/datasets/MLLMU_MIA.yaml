forget:
  handler: ImageQADataset
  args:
    hf_args:
      path: parquet
      data_files: ${eval.mia.forget_path}
      split: train
    qa_pairs_key: Generation_Task
    qa_question_key: Question
    qa_answer_key: Ground_Truth
    tokenize: false
holdout:
  handler: ImageQADataset
  args:
    hf_args:
      path: parquet
      data_files: ${eval.mia.holdout_path}
      split: train
    qa_pairs_key: Generation_Task
    qa_question_key: Question
    qa_answer_key: Ground_Truth
    tokenize: false
