# @package eval.safeeraser

defaults:
  - safeeraser_metrics:
      - generation
      - local_utility
      - judge
  - _self_

metrics: {}
handler: SafeEraserEvaluator
output_dir: ${paths.output_dir}
overwrite: true
data_root: ${paths.data_dir}/eval/safeeraser
image_root: ${eval.safeeraser.data_root}
splits:
  train: ${eval.safeeraser.data_root}/all_train.json
  val: ${eval.safeeraser.data_root}/all_val.json
processor_path: ${model.tokenizer_args.pretrained_model_name_or_path}
model_identity:
  pretrained_model: ${model.model_args.pretrained_model_name_or_path}
  adapter_path: ${oc.select:model.adapter_path,null}
prompt_style: auto
seed: 233
max_samples: null
checkpoint_every: 10
generation_args:
  max_new_tokens: 512
  do_sample: true
  temperature: 1.0
  top_p: 0.9
  num_beams: 1
# Preserve the released scorer's reference/prediction order. The explicit
# reference_first mode instead treats source answers as reference answers.
answer_order: upstream
judge:
  enabled: false
  base_url: ${oc.env:SAFEERASER_API_BASE,https://api.chatanywhere.tech/v1}
  model: ${oc.env:SAFEERASER_JUDGE_MODEL,gpt-4o}
  api_key_env: SAFEERASER_API_KEY
  timeout: 30
  retries: 3
  retry_delay: 1
