# @package eval.gqa

defaults:
  - mllm_eval_metrics: gqa
  - _self_

metrics: {}

handler: MLLMEvalEvaluator
output_dir: ${paths.output_dir}
overwrite: true
name: GQA-testdev-balanced
benchmark: gqa
format: parquet
data_path: ${paths.data_dir}/eval/gqa/testdev_balanced_instructions.parquet
images_path: ${paths.data_dir}/eval/gqa/testdev_balanced_images.parquet
image_root: ${paths.data_dir}/eval/gqa
processor_path: ${model.tokenizer_args.pretrained_model_name_or_path}
model_family: null
prompt_style: auto
generation_args:
  max_new_tokens: 8
  do_sample: false
max_samples: null
sample_seed: null
