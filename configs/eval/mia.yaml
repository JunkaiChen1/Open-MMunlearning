# @package eval.mia

defaults:
  - /data/datasets@metrics.attack.datasets: MLLMU_MIA
  - /collator@metrics.attack.collators: DataCollatorForMultimodalQADataset
  - _self_

handler: MIAEvaluator
output_dir: ${paths.output_dir}
overwrite: true

# Independent MIA over generation questions, using the standard QA collator.
# These attack scores retain the original MIA formulas and AUC orientation.
ratio: 10
forget_path: ${paths.data_dir}/eval/mllmu/forget_${eval.mia.ratio}/*.parquet
holdout_path: ${paths.data_dir}/eval/mllmu/Test_Set/*.parquet
attack: loss
batch_size: 1
k: 0.2
p: 2
reference_model: null

metrics:
  attack:
    handler: mia_auc
    attack: ${eval.mia.attack}
    batch_size: ${eval.mia.batch_size}
    k: ${eval.mia.k}
    p: ${eval.mia.p}
    reference_model: ${eval.mia.reference_model}
    collators:
      DataCollatorForMultimodalQADataset:
        args:
          processor_path: ${model.tokenizer_args.pretrained_model_name_or_path}
          system_prompt: ${oc.select:model.template_args.system_prompt,null}
          index: index
          padding_side: ${oc.select:model.tokenizer_args.padding_side,null}
