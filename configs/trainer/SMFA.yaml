defaults:
  - finetune

handler: SMFA
method_args:
  multi_k: 5.0
  text_k: 10.0
  lora_adapter_names: [MFA_multi, MFA_text, RA]
  source_adapter_path: ${oc.select:model.adapter_path,null}
args:
  per_device_train_batch_size: 2
  learning_rate: 1e-4
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  remove_unused_columns: false
  do_train: true
  do_eval: false
  eval_on_start: false
  eval_strategy: "no"
  save_strategy: "no"
  num_train_epochs: 5
