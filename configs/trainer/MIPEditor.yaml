defaults:
  - finetune

handler: MIPEditor
args:
  seed: 42
  per_device_train_batch_size: 6
  learning_rate: 5e-4
  weight_decay: 0.01
  optim: adamw_torch
  lr_scheduler_type: linear
  warmup_steps: 0
  max_grad_norm: 0.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  num_train_epochs: 1
method_args:
  path_topk: 5
  path_num_batches: null
  fisher_steps: 4
  ig_steps: 4
  rmu_layer_id: 7
  steering_coeff: 1.0
  retain_alpha: 0.5
  forget_beta: 0.5
  control_coeff: 10.0
  source_adapter_path: ${oc.select:model.adapter_path,null}
